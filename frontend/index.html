<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULSO — Estúdio de leitura</title>
  </head>
  <body>
    <div id="root" style="min-height:100vh">Carregando PULSO…</div>
    <noscript>Ative JavaScript para usar o PULSO.</noscript>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.dataset.mounted) root.textContent = 'Não foi possível carregar o PULSO. Execute npm start na raiz do projeto e abra http://localhost:8787. Não abra index.html diretamente.';
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
